<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Grand Academy | Admissions Contact</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <nav class="navbar">
        <div class="nav-logo">🏫 Grand Academy</div>
        <ul class="nav-links">
            <li><a href="index.html">Home</a></li>
            <li><a href="about.html">About Us</a></li>
            <li><a href="academics.html">Academics</a></li>
            <li><a href="contact.html" class="active">Contact</a></li>
        </ul>
    </nav>

    <section class="contact-container">
        <div class="form-header">
            <h2>Admissions Inquiry</h2>
            <p>Have questions about enrollment? Fill out the form below, and our admissions team will reach out to you shortly.</p>
        </div>

        <form class="admission-form">
            <div class="form-group">
                <label for="parentName">Parent/Guardian Name</label>
                <input type="text" id="parentName" placeholder="John Doe" required>
            </div>

            <div class="form-group">
                <label for="email">Email Address</label>
                <input type="email" id="email" placeholder="johndoe@example.com" required>
            </div>

            <div class="form-group">
                <label for="gradeLevel">Grade Level of Interest</label>
                <select id="gradeLevel">
                    <option value="elementary">Elementary School</option>
                    <option value="middle">Middle School</option>
                    <option value="high">High School</option>
                </select>
            </div>

            <div class="form-group">
                <label for="message">Your Message / Questions</label>
                <textarea id="message" rows="5" placeholder="Tell us about your student..."></textarea>
            </div>

            <button type="submit" class="btn-submit">Submit Inquiry</button>
        </form>
    </section>

    <script src="script.js"></script>
</body>
</html>
